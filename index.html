<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Cricket Hot Spot</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.01;z-index:-1;pointer-events:none}
  #top{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);display:none;gap:8px}
  #top button{height:38px;padding:0 12px;border-radius:10px;border:1.5px solid #fff;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:700}
  #top button.on{background:#fff;color:#000}
  #sens{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);display:none;align-items:center;gap:10px;font-size:12px;opacity:.85}
  #sens input{flex:1}
  #toast{position:fixed;left:0;right:0;top:40%;text-align:center;padding:0 24px;font-size:18px;font-weight:700;text-shadow:0 0 8px #000;pointer-events:none}
  #edge{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);text-align:center;font-size:clamp(28px,9vw,56px);font-weight:900;letter-spacing:.06em;opacity:0;transition:opacity .15s;text-shadow:0 0 12px #fff,0 0 30px #fff;pointer-events:none}
  #tag{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font-size:14px;font-weight:700;letter-spacing:.12em;opacity:.8;display:none}
  #start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;border:4px solid #fff;background:#000;color:#fff;font-size:34px;font-weight:900;letter-spacing:.1em;box-shadow:0 0 40px rgba(255,255,255,.45)}
  #start:active{background:#fff;color:#000}
  #hint{position:fixed;left:0;right:0;top:calc(50% + 130px);text-align:center;padding:0 24px;font-size:14px;line-height:1.5;opacity:.65}
  #msg{position:fixed;left:0;right:0;top:18%;text-align:center;padding:0 24px;color:#ff8a8a;font-size:15px}
  #bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:none;gap:12px;padding:0 16px}
  #bar button{flex:1;height:64px;border-radius:16px;border:2px solid #fff;background:rgba(0,0,0,.6);color:#fff;font-size:15px;font-weight:800;letter-spacing:.06em}
  #bar button:active{background:#fff;color:#000}
  
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>
<div id="tag">● LIVE</div>
<div id="edge">EDGE DETECTED</div>
<button id="start">START</button>
<div id="hint">Rest the phone on a stable stand facing the bat.<br>Keep it still. Works offline.</div>
<div id="msg"></div>
<div id="top"><button id="dbg">DEBUG</button><button id="reset">RESET</button><button id="test">TEST</button><button id="clr">CLR</button></div>
<div id="toast"></div>
<div id="sens"><span>Sensitivity</span><input id="sl" type="range" min="1" max="9" value="6"></div>
<div id="bar"><button id="bat">SET BAT</button><button id="blk">BLOCK ZONE</button><button id="replay">▶ REPLAY</button></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),vid=$('v');
let TH=30;const EDGE_PX=15,SLOW=.25,CAP=200;let DT=33,kN=1;
let cw=0,ch=0,dpr=1,s=1,dx=0,dy=0,pw=0,ph=0,dw=192,dh=0;const F=2;
let pctx,oc,octx,img,bg,diff,mask,vis,stack,frames,T,EV;
let wi=0,cnt=0,edgeT=0,ex=0,ey=0,bgOk=false,warm=0,lastP=0,mode='idle',order=[],rs=0;
let trk=null,batSeg=null,zones=[],markStep=0,markA=null,useRV=false,debug=false,dbg={},fps=0,fc=0,fT=0,toastT=0;

function resize(){dpr=Math.min(devicePixelRatio||1,2);cw=Math.round(innerWidth*dpr);ch=Math.round(innerHeight*dpr);cv.width=cw;cv.height=ch;layout()}
function layout(){if(!pw)return;s=Math.max(cw/pw,ch/ph);dx=(cw-pw*s)/2;dy=(ch-ph*s)/2}
addEventListener('resize',resize);resize();
function toast(t,ms){$('toast').textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>$('toast').textContent='',ms||2500)}

function setup(){
  const vw=vid.videoWidth,vh=vid.videoHeight;
  pw=384;ph=Math.round(pw*vh/vw/2)*2;dh=ph/F;
  const p=document.createElement('canvas');p.width=pw;p.height=ph;
  pctx=p.getContext('2d',{willReadFrequently:true});
  oc=document.createElement('canvas');oc.width=pw;oc.height=ph;octx=oc.getContext('2d');
  img=octx.createImageData(pw,ph);
  bg=new Float32Array(pw*ph);diff=new Uint8Array(pw*ph);
  mask=new Uint8Array(dw*dh);vis=new Uint8Array(dw*dh);stack=new Int32Array(dw*dh);
  frames=Array.from({length:CAP},()=>new Uint8Array(pw*ph));
  T=new Float64Array(CAP);EV=new Float64Array(CAP*3);layout();
}

// ---------- Frame -> Hot Spot image (with auto-exposure compensation) ----------
const lumA=()=>lumA.a||(lumA.a=new Uint8Array(pw*ph));
function process(now){
  pctx.drawImage(vid,0,0,pw,ph);
  const d=pctx.getImageData(0,0,pw,ph).data,od=img.data,g=frames[wi],n=pw*ph,L=lumA();
  let sl=0,sb=0;
  for(let i=0,j=0;i<n;i++,j+=4){const l=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;L[i]=l;sl+=l;if(bgOk)sb+=bg[i]}
  const off=bgOk?Math.max(-25,Math.min(25,(sl-sb)/n)):0;
  for(let i=0,j=0;i<n;i++,j+=4){
    const l=L[i];if(!bgOk)bg[i]=l;
    const b=bg[i]+off,df=Math.min(255,Math.abs(l-b)),v=df>TH?Math.min(255,(df*3+l*.35)|0):(l*.04)|0;
    diff[i]=df;g[i]=v;od[j]=od[j+1]=od[j+2]=v;od[j+3]=255;
    bg[i]=b+(l-b)*.04;
  }
  bgOk=true;
  if(warm>0)warm--;else detect(now);
  octx.putImageData(img,0,0);
  T[wi]=now;EV[wi*3]=edgeT;EV[wi*3+1]=ex;EV[wi*3+2]=ey;
  wi=(wi+1)%CAP;if(cnt<CAP)cnt++;
}

// ---------- Detection ----------
function segInfo(x,y,a){
  const vx=a[2]-a[0],vy=a[3]-a[1],l2=vx*vx+vy*vy||1,t=((x-a[0])*vx+(y-a[1])*vy)/l2,c=t<0?0:t>1?1:t;
  const px=a[0]+c*vx,py=a[1]+c*vy;return {d:Math.hypot(x-px,y-py),t,px,py};
}
const inZone=(x,y)=>zones.some(z=>x>=z[0]&&x<=z[2]&&y>=z[1]&&y<=z[3]);
function detect(now){
  dbg={blobs:0,ball:null,gap:null};
  if(!batSeg)return;                       // bat must be marked: no auto guessing
  for(let y=0;y<dh;y++)for(let x=0;x<dw;x++){
    const i=(y*F)*pw+x*F;mask[y*dw+x]=Math.max(diff[i],diff[i+1],diff[i+pw])>TH?1:0;
  }
  vis.fill(0);const cands=[];let nb=0;
  for(let k=0;k<mask.length;k++){
    if(!mask[k]||vis[k])continue;
    let sp=0;stack[sp++]=k;vis[k]=1;nb++;
    const b={a:0,sx:0,sy:0,x0:999,x1:0,y0:999,y1:0};
    while(sp){
      const p=stack[--sp],x=p%dw,y=(p/dw)|0;
      b.a++;b.sx+=x;b.sy+=y;
      if(x<b.x0)b.x0=x;if(x>b.x1)b.x1=x;if(y<b.y0)b.y0=y;if(y>b.y1)b.y1=y;
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const nx=x+ox,ny=y+oy;if(nx<0||ny<0||nx>=dw||ny>=dh)continue;
        const q=ny*dw+nx;if(mask[q]&&!vis[q]){vis[q]=1;stack[sp++]=q}
      }
    }
    if(b.a>=2&&b.a<=70&&b.x1-b.x0<=16&&b.y1-b.y0<=16){b.cx=b.sx/b.a;b.cy=b.sy/b.a;cands.push(b)}
  }
  dbg.blobs=nb;
  let ball=null;
  if(trk){
    const px=trk.x+trk.vx,py=trk.y+trk.vy,gate=Math.max(14,Math.hypot(trk.vx,trk.vy)*1.6+8);let bd=gate;
    for(const b of cands){const dd=Math.hypot(b.cx-px,b.cy-py);if(dd<bd){bd=dd;ball=b}}
  }
  if(!ball){let bd=1e9;for(const b of cands){const dd=segInfo(b.cx,b.cy,batSeg).d;if(dd<bd){bd=dd;ball=b}}}
  let hit=null;
  const ok=(h)=>{ // contact must be ON the bat and outside block zones (pad / ground)
    if(!h||h.t<-.08||h.t>1.08||inZone(h.px,h.py))return null;return h;
  };
  if(ball){
    const m=trk&&trk.miss<=3?trk.miss+1:0;
    const nt={x:ball.cx,y:ball.cy,vx:m?(ball.cx-trk.x)/m:0,vy:m?(ball.cy-trk.y)/m:0,n:m?trk.n+1:1,miss:0,pvx:m?trk.vx:0,pvy:m?trk.vy:0};
    const si=segInfo(ball.cx,ball.cy,batSeg),gap=(si.d-Math.sqrt(ball.a/Math.PI))*F*s/dpr;
    nt.gap=gap;nt.si=si;trk=nt;dbg.ball=ball;dbg.gap=gap;
    if(nt.n>=2){
      const s0=Math.hypot(nt.pvx,nt.pvy)*kN,s1=Math.hypot(nt.vx,nt.vy)*kN;
      const deflect=s0>1.2&&((nt.pvx*nt.vx+nt.pvy*nt.vy)/(Math.hypot(nt.pvx,nt.pvy)*Math.hypot(nt.vx,nt.vy)+1e-6)<.8||s1<s0*.45);
      if(gap<EDGE_PX&&(deflect||nt.n>=3))hit=ok(si);          // close + real ball track
      else if(gap<EDGE_PX*2&&deflect)hit=ok(si);              // clear deflection near bat
    }
  }else if(trk){
    trk.miss++;
    if(trk.miss===2&&trk.gap<EDGE_PX*2&&Math.hypot(trk.vx,trk.vy)*kN>1.2)hit=ok(trk.si);
    if(trk.miss>6)trk=null;
  }
  if(hit&&now-edgeT>1200){edgeT=now;ex=hit.px*F;ey=hit.py*F;if(navigator.vibrate)navigator.vibrate(80)}
}

// ---------- Drawing ----------
function glow(et,x,y,age){
  if(!et||age<0||age>1000)return;
  const a=1-age/1000,cx=dx+x*s,cy=dy+y*s,r=(72+age*.1)*dpr;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  gr.addColorStop(0,`rgba(255,255,255,${a})`);gr.addColorStop(.25,`rgba(255,255,255,${a*.55})`);gr.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(cx,cy,(4+8*a)*dpr,0,7);ctx.fill();
  ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=2*dpr;
  for(let i=0;i<10;i++){const an=i*.628+(et%1),l1=r*.2,l2=r*(.5+.5*((i*7)%3)/2);
    ctx.beginPath();ctx.moveTo(cx+Math.cos(an)*l1,cy+Math.sin(an)*l1);ctx.lineTo(cx+Math.cos(an)*l2,cy+Math.sin(an)*l2);ctx.stroke()}
  ctx.restore();
}
const G=(v,a)=>dx+v*F*s;const GY=v=>dy+v*F*s;
function overlay(live){
  if(batSeg){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3*dpr;ctx.setLineDash([10*dpr,8*dpr]);
    ctx.beginPath();ctx.moveTo(G(batSeg[0]),GY(batSeg[1]));ctx.lineTo(G(batSeg[2]),GY(batSeg[3]));ctx.stroke();ctx.setLineDash([])}
  if(debug||markStep>=10){ctx.strokeStyle='rgba(255,70,70,.8)';ctx.lineWidth=2*dpr;for(const z of zones)ctx.strokeRect(G(z[0]),GY(z[1]),(z[2]-z[0])*F*s,(z[3]-z[1])*F*s)}
  if(markA){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(G(markA[0]),GY(markA[1]),8*dpr,0,7);ctx.fill()}
  if(!debug||!live)return;
  ctx.lineWidth=2*dpr;ctx.font=`${12*dpr}px monospace`;
  if(dbg.ball){ctx.strokeStyle='#f44';ctx.beginPath();ctx.arc(G(dbg.ball.cx),GY(dbg.ball.cy),12*dpr,0,7);ctx.stroke();
    ctx.fillStyle='#f44';ctx.fillText('gap '+Math.round(dbg.gap)+'px',G(dbg.ball.cx)+16*dpr,GY(dbg.ball.cy))}
  ctx.fillStyle='#0f0';ctx.fillText(`fps ${fps}  blobs ${dbg.blobs||0}  TH ${TH}  bat:${batSeg?'set':'NOT SET'}  zones:${zones.length}`,10*dpr,ch-130*dpr);
}
function draw(et,x,y,ref,live){
  ctx.fillStyle='#000';ctx.fillRect(0,0,cw,ch);if(!pw)return;
  ctx.drawImage(oc,dx,dy,pw*s,ph*s);
  glow(et,x,y,ref-et);overlay(live);
  const age=ref-et;$('edge').style.opacity=(et&&age>=0&&age<1500)?1:0;
}

// ---------- Loop / replay ----------
function loop(now){
  requestAnimationFrame(loop);
  if(mode==='live'){
    if(!useRV&&vid.readyState>=2&&now-lastP>=32)frame(now);
  }else if(mode==='replay'){
    const last=order[order.length-1],head=T[order[0]]+(now-rs)*SLOW;
    if(head>T[last]+600){stopReplay();return}
    let k=0;while(k+1<order.length&&T[order[k+1]]<=head)k++;
    const i=order[k],g=frames[i],od=img.data;
    for(let p=0,j=0;p<g.length;p++,j+=4){od[j]=od[j+1]=od[j+2]=g[p];od[j+3]=255}
    octx.putImageData(img,0,0);draw(EV[i*3],EV[i*3+1],EV[i*3+2],T[i],false);
  }
}
function frame(now){
  DT=Math.max(8,Math.min(100,now-lastP));lastP=now;kN=Math.max(.5,Math.min(2,33.3/DT));
  process(now);draw(edgeT,ex,ey,now,true);
  fc++;if(now-fT>1000){fps=fc;fc=0;fT=now;if(!debug)$('tag').textContent='● LIVE '+fps+'fps'}
}
function rv(now){vid.requestVideoFrameCallback(rv);if(mode==='live')frame(now)}
function startReplay(){
  if(mode!=='live'||cnt<10)return;
  const tn=T[(wi-1+CAP)%CAP];order=[];
  for(let k=cnt;k>=1;k--){const i=(wi-k+CAP)%CAP;if(T[i]>=tn-3000)order.push(i)}
  if(order.length<5)return;
  mode='replay';rs=performance.now();$('replay').textContent='■ STOP';$('tag').textContent='⏪ REPLAY 0.25×';
}
function stopReplay(){mode='live';bgOk=false;warm=8;trk=null;$('replay').textContent='▶ REPLAY';$('tag').textContent='● LIVE';$('edge').style.opacity=0}

// ---------- Camera ----------
async function start(){
  $('msg').textContent='';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('msg').textContent='Camera ke liye https:// link chahiye (GitHub Pages / Netlify).';return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,min:30}}});
    vid.srcObject=st;await vid.play();
    if(!vid.videoWidth)await new Promise(r=>vid.onloadedmetadata=r);
    setup();bgOk=false;warm=10;mode='live';useRV='requestVideoFrameCallback' in vid;if(useRV)vid.requestVideoFrameCallback(rv);
    $('start').style.display='none';$('hint').style.display='none';
    $('bar').style.display='flex';$('top').style.display='flex';$('sens').style.display='flex';$('tag').style.display='block';
    toast('Pehle SET BAT: bat ke 2 sire tap karo',3500);
    setTimeout(()=>{if(!fc&&mode==='live')$('msg').textContent='Camera frames nahi aa rahe. Page reload karke dobara try karo.'},4000);
    if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
  }catch(e){$('msg').textContent='Camera error: '+(e.message||e.name)+' — browser settings mein camera Allow karo.'}
}
$('start').onclick=start;
$('replay').onclick=()=>mode==='replay'?stopReplay():startReplay();
$('reset').onclick=()=>{if(mode==='live'){bgOk=false;warm=10;edgeT=0;trk=null;toast('Background reset')}};
$('test').onclick=()=>{if(mode==='live'){edgeT=performance.now();ex=pw/2;ey=ph/2}};
$('dbg').onclick=e=>{debug=!debug;e.target.classList.toggle('on',debug);if(!debug)$('tag').textContent='● LIVE'};
$('sl').oninput=e=>{TH=60-5*(+e.target.value)};
$('clr').onclick=()=>{zones=[];markStep=0;markA=null;toast('Block zones clear')};
$('blk').onclick=()=>{if(mode!=='live')return;markStep=11;markA=null;toast('Pad / zameen ke area ka ek KONA tap karo')};
$('bat').onclick=()=>{
  if(mode!=='live')return;
  if(batSeg){batSeg=null;markA=null;markStep=0;trk=null;$('bat').textContent='SET BAT';return}
  markStep=1;markA=null;toast('Bat ka HANDLE (upar) tap karo');
};
cv.addEventListener('pointerdown',e=>{
  if(!markStep||!pw)return;
  const x=((e.clientX*dpr-dx)/s)/F,y=((e.clientY*dpr-dy)/s)/F;
  if(markStep===11){markA=[x,y];markStep=12;toast('Ab ulta (opposite) kona tap karo');return}
  if(markStep===12){zones.push([Math.min(markA[0],x),Math.min(markA[1],y),Math.max(markA[0],x),Math.max(markA[1],y)]);markA=null;markStep=0;toast('Block zone set ✓ ('+zones.length+')',1500);return}
  if(markStep===1){markA=[x,y];markStep=2;toast('Ab bat ke TIP (neeche) tap karo')}
  else{batSeg=[markA[0],markA[1],x,y];markA=null;markStep=0;trk=null;$('bat').textContent='CLEAR BAT';toast('Bat set ✓',1500)}
});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
