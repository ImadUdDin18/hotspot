<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B4D2C">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Gao Cricket Scorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone scorer. Dark-green scoreboard on top, big thumb keypad, bottom tab bar. */
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --ink:#12231A; --muted:#58695F; --line:#D3DED5;
  --board:#0B4D2C; --pitch:#0E6B3E; --soft:#E1EEE5; --key:#F6F9F6;
  --wicket:#C62F1D; --wicket-soft:#FBE3DE;
  --amber:#F0B000; --amber-ink:#3F2E00; --amber-soft:#FFF0C4;
  --blue:#2456B8; --blue-soft:#E0E9FB;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A130E; --surface:#13201A; --ink:#E6F0E9; --muted:#9BB0A3; --line:#26382F;
  --board:#0E5A34; --pitch:#1E8A54; --soft:#1B2E24; --key:#192B22;
  --wicket:#F0614D; --wicket-soft:#3A1A15;
  --amber:#F2B632; --amber-ink:#2E2200; --amber-soft:#3A2E0A;
  --blue:#7AA3F2; --blue-soft:#17233F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A130E; --surface:#13201A; --ink:#E6F0E9; --muted:#9BB0A3; --line:#26382F;
  --board:#0E5A34; --pitch:#1E8A54; --soft:#1B2E24; --key:#192B22;
  --wicket:#F0614D; --wicket-soft:#3A1A15;
  --amber:#F2B632; --amber-ink:#2E2200; --amber-soft:#3A2E0A;
  --blue:#7AA3F2; --blue-soft:#17233F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;
  padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;font-family:var(--f-disp);letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;line-height:1}
h2{font-size:24px}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--f-body);font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

/* scoreboard */
.board{background:var(--board);color:#fff;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.b-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;opacity:.9;font-weight:600}
.b-team{font-family:var(--f-disp);font-size:22px;letter-spacing:.02em;opacity:1;text-transform:uppercase}
.b-score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.runs{font-family:var(--f-disp);font-weight:700;font-size:84px;line-height:.95;font-variant-numeric:tabular-nums}
.slash{font-family:var(--f-disp);font-size:56px;opacity:.6}
.wk{font-family:var(--f-disp);font-weight:700;font-size:56px;font-variant-numeric:tabular-nums;color:#FFC9C0}
.b-ov{margin-left:auto;text-align:right;font-family:var(--f-disp);font-size:34px;font-weight:600;line-height:1}
.b-ov small{display:block;font-family:var(--f-body);font-size:13px;opacity:.8;font-weight:500}
.b-meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.14);border-radius:8px;padding:4px 10px;font-size:14px;font-weight:600}
.b-chase{background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px;font-size:15px}
.b-prev{font-size:14px;opacity:.85}

.fh{background:var(--amber);color:var(--amber-ink);border-radius:10px;padding:10px 12px;font-weight:700;display:flex;gap:10px;align-items:center}
.fh b{font-family:var(--f-disp);font-size:24px;letter-spacing:.04em}

/* over chips */
.balls{display:flex;gap:6px;flex-wrap:wrap;min-height:38px;align-items:center}
.bl{min-width:38px;height:38px;padding:0 8px;border-radius:19px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:700;font-size:18px;background:var(--soft);border:1px solid var(--line)}
.bl.k-four{background:var(--blue);color:#fff;border-color:var(--blue)}
.bl.k-six{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.bl.k-ex{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.bl.k-w{background:var(--wicket);color:#fff;border-color:var(--wicket)}

/* tables */
.tbl{display:grid;gap:0;font-variant-numeric:tabular-nums;font-size:15px}
.tr{display:grid;align-items:center;padding:7px 0;border-top:1px solid var(--line);gap:4px}
.tr.th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-top:0}
.bat-grid{grid-template-columns:minmax(0,1fr) 38px 38px 28px 28px 38px}
.bowl-grid{grid-template-columns:minmax(0,1fr) 42px 28px 38px 28px 42px}
.tr>span:not(:first-child){text-align:right}
.nm{font-weight:600;overflow-wrap:anywhere}
.nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.strike{color:var(--pitch);font-weight:700}
.empty{color:var(--muted);font-style:italic}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{min-height:62px;border-radius:12px;border:1px solid var(--line);background:var(--key);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 2px}
.key b{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1}
.key i{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.key:active{transform:scale(.97)}
.key:disabled{opacity:.4}
.key.k4{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.key.k4 i{color:var(--blue)}
.key.k6{background:var(--pitch);border-color:var(--pitch);color:#fff}
.key.k6 i{color:#fff;opacity:.9}
.key.kw{background:var(--wicket);border-color:var(--wicket);color:#fff}
.key.kw i{color:#fff;opacity:.9}
.key.kx{background:var(--amber-soft);border-color:var(--amber)}
.key.kx b{font-size:22px}
.key.ku{grid-column:span 2;flex-direction:row;gap:8px}
.key.ku b{font-size:22px}

.btn{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--key);padding:8px 14px;font-weight:700}
.btn.pri{background:var(--pitch);border-color:var(--pitch);color:#fff}
.btn.red{background:var(--wicket);border-color:var(--wicket);color:#fff}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.4}
.chip{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--key);font-weight:600}
.chip.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.chip:disabled{opacity:.35}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* feed and out list */
.out-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.out-n{width:28px;height:28px;border-radius:14px;background:var(--wicket);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:700;font-size:16px}
.feed{display:flex;flex-direction:column}
.fd{padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.fd.k-w{color:var(--wicket);font-weight:700}
.fd.k-four{color:var(--blue);font-weight:700}
.fd.k-six{color:var(--pitch);font-weight:700}
.fd.k-in{font-weight:600}
.fd.k-info{color:var(--muted)}
.result{background:var(--amber);color:var(--amber-ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.result b{font-family:var(--f-disp);font-size:30px;line-height:1.05}

/* setup */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=number],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:200px;line-height:1.5;resize:vertical}
.cnt{font-size:14px;font-weight:600}
.cnt.bad{color:var(--wicket)}
.err{background:var(--wicket-soft);color:var(--wicket);border-radius:10px;padding:10px 12px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tabs */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{min-height:48px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:14px;color:var(--muted)}
.tab.on{background:var(--soft);color:var(--pitch)}

/* sheets */
.sbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:90%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sh-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.x{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--key);font-size:24px;line-height:1}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--key);padding:6px 10px;text-align:left;font-weight:600;overflow-wrap:anywhere}
.pbtn small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pbtn.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.pbtn.on small{color:#fff;opacity:.9}
.pbtn:disabled{opacity:.35}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:600}
.lv{margin-left:8px;background:var(--wicket);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;letter-spacing:.06em}
#mini{position:fixed;top:0;left:0;right:0;z-index:15;background:var(--board);color:#fff;display:none;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
#mini.on{display:block}
#mini .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
#mini b{font-family:var(--f-disp);font-size:26px;font-variant-numeric:tabular-nums}

:root{--gold:#F4B63A;--gold-deep:#B97F00}
.card{box-shadow:0 1px 0 var(--line),0 8px 18px rgba(0,0,0,.05)}
.hero{display:flex;gap:14px;align-items:center;background-color:var(--board);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 28px,rgba(0,0,0,0) 28px 56px);color:#fff;border-radius:16px;padding:18px 16px;border-bottom:5px solid var(--gold)}
.hero h1{font-size:38px;color:#fff}
.hero p{color:rgba(255,255,255,.85);margin-top:2px}
.hero svg{flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.board{background-color:var(--board);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 28px,rgba(0,0,0,0) 28px 56px),linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.3));position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);padding-top:18px}
.board::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--gold),#FFF3C4,var(--gold))}
.b-team{display:flex;align-items:center;color:var(--gold)}
.crest{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#3A2800;display:inline-flex;align-items:center;justify-content:center;font:700 16px var(--f-disp);margin-right:8px;flex:none}
.runs{text-shadow:0 3px 0 rgba(0,0,0,.28)}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:3px}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:700 13px var(--f-disp);letter-spacing:.02em;flex:none}
.nmw{display:flex;gap:8px;align-items:center;min-width:0}
.pbtn{display:flex;align-items:center;gap:10px}
.pbtn.on .av{box-shadow:0 0 0 2px #fff}
.key{box-shadow:0 3px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.k4{box-shadow:0 3px 0 var(--blue)}
.key.k6{background:linear-gradient(180deg,#17894F,var(--pitch));box-shadow:0 3px 0 rgba(0,0,0,.4)}
.key.kw{box-shadow:0 3px 0 rgba(0,0,0,.35)}
.key.kx{box-shadow:0 3px 0 var(--amber)}
.tab.on{box-shadow:inset 0 -3px 0 var(--gold)}
#mini{border-bottom:3px solid var(--gold)}
.result{background:linear-gradient(135deg,#FFD97A,var(--gold));box-shadow:0 8px 20px rgba(0,0,0,.18)}
#flash{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex;align-items:center;justify-content:center;padding:16px}
.fl{padding:18px 24px;max-width:calc(100vw - 32px);border-radius:22px;text-align:center;color:#fff;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:flpop 1.1s ease-out forwards;max-width:100%;border:3px solid rgba(255,255,255,.55)}
.fl b{display:block;font-family:var(--f-disp);font-size:clamp(38px,14vw,66px);line-height:1;letter-spacing:.03em}
.fl span{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.fl-four{background:linear-gradient(135deg,#2B63D1,#1B3F8A)}
.fl-six{background:linear-gradient(135deg,#12A05C,#0B5E34)}
.fl-w{background:linear-gradient(135deg,#E24A33,#9E2112)}
.fl-win{background:linear-gradient(135deg,#FFD97A,#E7A100);color:#3F2E00;animation-duration:3.2s}
.fl-win b{font-size:44px}
@keyframes flpop{0%{opacity:0;transform:scale(.55) rotate(-3deg)}12%{opacity:1;transform:scale(1.1) rotate(1deg)}25%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}

body.ov{background:transparent!important;padding:0!important}
.ov .app{max-width:none;gap:0}
body.ov #nav,body.ov #mini,body.ov #sheet,body.ov #toast,body.ov header{display:none!important}
.ovwrap{position:fixed;left:2vw;right:2vw;bottom:3vh;display:flex;flex-direction:column;gap:.7em;font-size:clamp(16px,2.5vw,40px)}
.ovbar{position:relative;display:flex;font-size:1em;align-items:stretch;border-radius:14px;overflow:hidden;font-size:clamp(16px,2.5vw,40px);color:#fff;box-shadow:0 0 0 .12em #FFD400,0 10px 34px rgba(0,0,0,.6);font-family:var(--f-body);flex-wrap:wrap}
.ov-l{background:linear-gradient(180deg,#FFE45C,#FFC400);color:#1B1300;padding:.35em .9em;display:flex;align-items:baseline;gap:.6em;border-right:.18em solid #0B4D2C}
.ov-t{font-family:var(--f-disp);text-transform:uppercase;color:#0B4D2C;font-size:1.05em;font-weight:800;letter-spacing:.04em}
.ov-s{font-family:var(--f-disp);font-size:2.7em;font-weight:700;line-height:1;color:#111}
.ov-s b{font-weight:800}
.ov-o{font-size:.85em;font-weight:700;color:#3A2800}
.ov-m{background:rgba(4,16,10,.95);padding:.4em 1em;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.25em}
.ov-row{display:flex;gap:1em;align-items:center;flex-wrap:wrap}
.ov-row.dim{font-size:.85em}
.ob{font-weight:700;color:#fff}
.ob b{font-family:var(--f-disp);font-size:1.2em;color:#7CFFB2}
.ob i{opacity:.8;font-style:normal}
.ob.st{background:#FFD400;color:#111;border-radius:.4em;padding:.05em .5em}
.ob.st b{color:#111}
.obls{display:inline-flex;gap:.3em}
.obl{min-width:1.8em;height:1.8em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.25);font-family:var(--f-disp);font-weight:800;font-size:.95em;padding:0 .25em}
.obl.k-four{background:#2B63D1}.obl.k-six{background:#12A05C}.obl.k-w{background:#D8402B}.obl.k-ex{background:#B97F00}
.ofh{background:#FFD400;color:#3A2800;font-weight:800;border-radius:.4em;padding:0 .5em}
.ov-r{background:rgba(2,10,6,.97);padding:.4em 1em;display:flex;align-items:center;font-size:.9em;font-weight:700;border-left:.15em solid rgba(255,255,255,.25)}
.ov-fl{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:.8em;padding:.2em 1em;color:#fff;font-family:var(--f-disp);text-align:center;animation:ovpulse 1s ease-in-out infinite alternate}
.ov-fl b{font-size:1.9em;line-height:1;letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
.ov-fl span{font-size:1.05em;font-family:var(--f-body);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ov-fl.fl-four{background:linear-gradient(135deg,#2B63D1,#1B3F8A)}
.ov-fl.fl-six{background:linear-gradient(135deg,#14B866,#0B6B3A)}
.ov-fl.fl-w{background:linear-gradient(135deg,#E24A33,#9E2112)}
@keyframes ovpulse{from{filter:brightness(1)}to{filter:brightness(1.3)}}
.ovp{max-height:62vh;overflow:hidden;border-radius:14px;background:rgba(4,16,10,.95);color:#fff;font-size:.85em;box-shadow:0 0 0 .12em #FFD400,0 10px 34px rgba(0,0,0,.6);font-family:var(--f-body);animation:ovup .35s ease-out}
@keyframes ovup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.ovp h4{margin:0;padding:.45em .9em;background:linear-gradient(180deg,#FFE45C,#FFC400);color:#1B1300;font-family:var(--f-disp);font-size:1.15em;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:1em}
.ovp .ln{display:grid;grid-template-columns:1fr auto;gap:.8em;padding:.3em .9em;border-bottom:1px solid rgba(255,255,255,.12);align-items:baseline}
.ovp .ln small{display:block;opacity:.7;font-size:.72em}
.ovp .ln b{font-family:var(--f-disp);font-size:1.15em;color:#7CFFB2}
.ovp .ln.no{opacity:.7}
.ovp .ln.hd{opacity:.75;font-size:.8em;text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.07)}
.ovp .fx{padding:.3em .9em;border-bottom:1px solid rgba(255,255,255,.12)}
.ovp .fx.k-six{color:#7CFFB2;font-weight:800}.ovp .fx.k-four{color:#8DB5FF;font-weight:800}.ovp .fx.k-w{color:#FF8A78;font-weight:800}
.tvc .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tvc .btn{min-height:50px}
.strip .ovwrap,body.strip .ovwrap{left:0;right:0;top:0;bottom:0;font-size:clamp(8px,2.1vw,22px)}

</head><body>
<div class="app" id="app"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="mini"></div>
<div id="flash"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var KEY='gao-cricket-v1';
var S=null, hist=[];
var ui={tab:'score',sheet:null,sv:0,op:{st:null,ns:null,bw:null},w:{k:'bowled',who:'st',fl:null,ball:'n',r:0},ex:{k:null,bye:false},ren:null,confirm:null,sum:'',err:''};
var setup={n:['Team A','Team B'],t:['',''],overs:6,wide:1,nb:1,fh:true,maxb:0,first:null};
var live={code:null,role:'scorer',ok:false,busy:false,dirty:false,t:null};
var KINDS={bowled:'Bowled',caught:'Caught',lbw:'LBW',runout:'Run Out',stumped:'Stumped',hitwkt:'Hit Wicket'};
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

function save(){if(ui.viewer)return;try{localStorage.setItem(KEY,JSON.stringify({S:S,hist:hist,setup:setup}))}catch(e){}pushLive()}
var PUB='https://imaduddin18.github.io/gao-cricket/';
function baseUrl(){return (location.protocol==='file:'||/^(localhost|127\.)/.test(location.hostname))?PUB:location.href.split('#')[0]}
function getCode(){
  try{var c=localStorage.getItem('gao-code');if(!c){c=Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6);localStorage.setItem('gao-code',c)}return c}
  catch(e){return 'g'+Math.random().toString(36).slice(2,10)}
}
var topicUrl=function(c){return 'https://ntfy.sh/gaocricket-'+c};
async function pack(trim){
  var o=JSON.parse(JSON.stringify(S));o.inn.forEach(function(i){i.feed=i.feed.slice(0,trim)});
  var j=JSON.stringify(o);
  if(window.CompressionStream){
    var buf=await new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    var u=new Uint8Array(buf),bin='';for(var i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);
    return 'v1:g:'+btoa(bin);
  }
  return 'v1:j:'+j;
}
async function unpack(m){
  if(m.slice(0,5)==='v1:j:')return JSON.parse(m.slice(5));
  if(m.slice(0,5)==='v1:g:'){
    var bin=atob(m.slice(5)),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  }
  return null;
}
function pushLive(force){
  if(live.role!=='scorer')return;
  if(!S&&!force)return;
  clearTimeout(live.t);live.t=setTimeout(doPush,force?0:1200);
}
async function doPush(){
  if(live.busy){live.dirty=true;return}
  live.busy=true;
  try{
    var body='v1:x';
    if(S){body=await pack(12);if(body.length>3900)body=await pack(3);if(body.length>3900)body=await pack(0)}
    var r=await fetch(topicUrl(live.code),{method:'POST',body:body});
    live.ok=r.ok;
  }catch(e){live.ok=false}
  live.busy=false;
  var el=document.querySelector('.lv');if(el)el.hidden=!live.ok;
  var st=$('livest');if(st)st.innerHTML=liveStatus();
  if(live.dirty){live.dirty=false;doPush()}
}
function liveStatus(){return live.ok?'<b>ON</b> — link wale sab live dekh sakte hain.':'Abhi connect nahi hua. Internet check karo; score likhna jaari rakho.'}
function applyRemote(o){
  S=o;ui.boot=false;ui.replay=(Date.now()-(ui.vstart||0))<3500;
  if(S&&ui.sv>=S.inn.length)ui.sv=0;
  if(ui.tab==='menu')ui.tab='score';
  render();
}
function startViewer(code){
  ui.viewer=true;S=null;ui.boot=true;render();
  var chain=Promise.resolve();
  try{
    var es=new EventSource(topicUrl(code)+'/sse?since=all');ui.vstart=Date.now();
    es.onopen=function(){ui.vstart=Date.now()};
    es.onmessage=function(ev){
      var d;try{d=JSON.parse(ev.data)}catch(e){return}
      if(d.event!=='message')return;
      chain=chain.then(function(){return unpack(d.message||'')}).then(applyRemote).catch(function(){});
    };
    es.onerror=function(){if(ui.boot){ui.vErr=true}};
  }catch(e){ui.vErr=true}
  setTimeout(function(){if(ui.boot){ui.boot=false;render()}},5000);
}

function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){S=d.S;hist=d.hist||[];if(d.setup)Object.assign(setup,d.setup)}}catch(e){}}

var cur=function(){return S.inn[S.cur]};
var pl=function(t,i){return S.teams[t].players[i]};
var bn=function(i){return pl(cur().bat,i)};
var ov=function(b){return Math.floor(b/6)+'.'+(b%6)};
var sr=function(r,b){return b?(r*100/b).toFixed(0):'-'};
var eco=function(r,b){return b?(r*6/b).toFixed(1):'-'};
var initials=function(n){var p=String(n).trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};
var av=function(n){var h=0,s=String(n);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return '<span class="av" style="background:hsl('+h+' 42% 36%)">'+esc(initials(n))+'</span>'};
var bwNew=function(){return {b:0,r:0,w:0,m:0,wd:0,nb:0,cr:0}};
var btNew=function(){return {r:0,b:0,f:0,s:0,out:null}};

function mut(fn){hist.push(JSON.stringify(S));if(hist.length>40)hist.shift();fn();save();render()}
function feed(I,k,x){I.feed.unshift({k:k,x:x});I.n=(I.n||0)+1;if(I.feed.length>70)I.feed.pop()}

function newInn(bat){return {bat:bat,bowl:1-bat,runs:0,wkts:0,balls:0,ex:{wd:0,nb:0,b:0,lb:0},bt:{},order:[],st:null,ns:null,bw:{},bowler:null,last:null,ob:[],fh:false,fow:[],feed:[],pend:['openers'],done:false,why:'',target:null}}

function startMatch(){
  var names=setup.t.map(function(t){return t.split('\n').map(function(s){return s.trim()}).filter(Boolean).slice(0,15)});
  if(names[0].length<2||names[1].length<2){ui.err='Har team main kam az kam 2 khilari ke naam likhein (har line main ek naam).';render();return}
  if(setup.first!==0&&setup.first!==1){ui.err='Toss wala option chuno: pehle batting kaun karega?';render();return}
  ui.err='';
  S={cfg:{overs:setup.overs,wide:setup.wide,nb:setup.nb,fh:setup.fh,maxb:setup.maxb},
     teams:[{name:setup.n[0].trim()||'Team A',players:names[0]},{name:setup.n[1].trim()||'Team B',players:names[1]}],
     inn:[newInn(setup.first)],cur:0,brk:false,over:false,result:''};
  hist=[];ui.tab='score';ui.sheet=null;save();render();
}

function dis(I,o){
  var b=o.by!=null?pl(I.bowl,o.by):'', f=o.fl!=null?pl(I.bowl,o.fl):'';
  switch(o.k){
    case 'bowled':return 'b '+b;
    case 'caught':return 'c '+(f||'?')+' b '+b;
    case 'lbw':return 'lbw b '+b;
    case 'stumped':return 'st '+(f||'?')+' b '+b;
    case 'hitwkt':return 'hit wicket b '+b;
    default:return 'run out'+(f?' ('+f+')':'');
  }
}

function ball(ev){
  var I0=cur();
  if(S.over||S.brk||I0.done||I0.pend.length||I0.bowler==null||I0.st==null||I0.ns==null)return;
  mut(function(){
    var I=cur(),cfg=S.cfg,B=I.bw[I.bowler],sIdx=I.st,t=ev.t;
    var legal=true,bat=0,total=0,bowl=0,run=0,faced=true,lab='',kind='run',txt='',wk=null;
    if(t==='run'){bat=total=bowl=run=ev.r;lab=String(ev.r);txt=ev.r?ev.r+(ev.r===1?' run':' runs'):'koi run nahi'}
    else if(t==='wd'){legal=false;faced=false;run=ev.r;total=bowl=cfg.wide+ev.r;I.ex.wd+=total;B.wd++;lab='Wd'+(ev.r?'+'+ev.r:'');txt='WIDE'+(ev.r?' + '+ev.r+' bhaage':'')+' ('+total+' run)';kind='ex'}
    else if(t==='nb'){legal=false;run=ev.r;total=cfg.nb+ev.r;I.ex.nb+=cfg.nb;B.nb++;
      if(ev.bye){bowl=cfg.nb;I.ex.b+=ev.r}else{bat=ev.r;bowl=total}
      lab='Nb'+(ev.r?'+'+ev.r:'');txt='NO BALL'+(ev.r?' + '+ev.r+(ev.bye?' bye':' bat se'):'')+' ('+total+' run)';kind='ex'}
    else if(t==='b'||t==='lb'){run=total=ev.r;I.ex[t]+=ev.r;lab=(t==='b'?'B':'Lb')+ev.r;txt=(t==='b'?'Bye ':'Leg bye ')+ev.r;kind='ex'}
    else if(t==='w'){
      var outIdx=ev.who==='st'?I.st:I.ns;
      if(ev.ball==='n'){bat=total=bowl=run=ev.r}
      else if(ev.ball==='wd'){legal=false;faced=false;run=ev.r;total=bowl=cfg.wide+ev.r;I.ex.wd+=total;B.wd++}
      else{legal=false;run=ev.r;bat=ev.r;total=bowl=cfg.nb+ev.r;I.ex.nb+=cfg.nb;B.nb++}
      wk={out:outIdx,k:ev.k,fl:ev.fl};lab='W'+(run?'+'+run:'');kind='w';txt='OUT!'
    }
    I.runs+=total;B.r+=bowl;B.cr+=bowl;
    var bt=I.bt[sIdx];
    if(faced)bt.b++;
    bt.r+=bat;
    if(bat===4){bt.f++;if(kind==='run')kind='four';txt=(t==='run')?'CHAUKKA! 4 run':txt}
    if(bat===6){bt.s++;if(kind==='run')kind='six';txt=(t==='run')?'CHAKKA! 6 run':txt}
    if(legal){I.balls++;B.b++}
    I.ob.push({l:lab,k:kind});
    if(t==='nb'||(t==='w'&&ev.ball==='nb')){if(cfg.fh)I.fh=true}else if(legal){I.fh=false}
    if(run%2===1){var tmp=I.st;I.st=I.ns;I.ns=tmp}
    var head=ov(I.balls)+'  '+pl(I.bowl,I.bowler)+' → '+pl(I.bat,sIdx)+': ';
    feed(I,kind==='w'?'info':kind,head+txt);
    if(wk){
      var o=I.bt[wk.out];o.out={k:wk.k,by:wk.k==='runout'?null:I.bowler,fl:wk.fl};
      I.wkts++;
      if(I.st===wk.out)I.st=null;else if(I.ns===wk.out)I.ns=null;
      if(wk.k!=='runout')B.w++;
      I.fow.push({s:I.runs,w:I.wkts,p:wk.out,o:ov(I.balls)});
      feed(I,'w','OUT #'+I.wkts+' — '+pl(I.bat,wk.out)+' ('+dis(I,o.out)+') — score '+I.runs+'/'+I.wkts);
      I.pend.push('bat');
    }
    if(legal&&I.balls%6===0){
      var t2=I.st;I.st=I.ns;I.ns=t2;
      if(B.cr===0)B.m++;
      B.cr=0;I.last=I.bowler;I.bowler=null;
      feed(I,'info','Over '+(I.balls/6)+' khatam — '+I.runs+'/'+I.wkts);
      I.pend.push('bowler');
    }
    var N=S.teams[I.bat].players.length,why='';
    if(I.wkts>=N-1)why='Sab out ho gaye';
    else if(I.balls>=cfg.overs*6)why='Overs poore';
    else if(I.target!=null&&I.runs>=I.target)why='Target poora';
    if(why){I.done=true;I.pend=[];I.why=why;endInnings()}
  });
}

function endInnings(){
  var I=cur();
  feed(I,'info','Innings khatam: '+I.why+' — '+I.runs+'/'+I.wkts);
  if(S.cur===0){S.brk=true;return}
  var a=S.inn[0],b=S.inn[1],A=S.teams[a.bat].name,Bn=S.teams[b.bat].name,N=S.teams[b.bat].players.length;
  S.over=true;
  if(b.runs>=b.target){var left=S.cfg.overs*6-b.balls;S.result=Bn+' '+((N-1)-b.wkts)+' wicket se jeet gaye'+(left>0?' ('+left+' gend baaki)':'')}
  else if(b.runs===a.runs)S.result='Match TIE ho gaya!';
  else S.result=A+' '+(a.runs-b.runs)+' run se jeet gaye';
}

function pickBat(i){mut(function(){var I=cur(),slot=I.st==null?'st':'ns';I[slot]=i;I.bt[i]=btNew();I.order.push(i);I.pend.shift();feed(I,'in','Naya batsman aaya: '+bn(i)+' (batting #'+I.order.length+')')})}
function pickBowl(i,forced){mut(function(){var I=cur();I.bowler=i;if(!I.bw[i])I.bw[i]=bwNew();if(forced){I.ob=[];I.pend.shift()}feed(I,'in','Bowling: '+pl(I.bowl,i)+(forced?' ne over shuru kiya':' ab bowling kar raha hai'))})}
function confirmOpen(){
  var o=ui.op;if(o.st==null||o.ns==null||o.bw==null||o.st===o.ns)return;
  var c=JSON.parse(JSON.stringify(o));ui.op={st:null,ns:null,bw:null};
  mut(function(){var I=cur();I.st=c.st;I.ns=c.ns;[c.st,c.ns].forEach(function(i){I.bt[i]=btNew();I.order.push(i)});I.bowler=c.bw;I.bw[c.bw]=bwNew();I.pend.shift();
    feed(I,'in','Batting shuru: '+bn(c.st)+' aur '+bn(c.ns)+' — Bowling: '+pl(I.bowl,c.bw))});
}
function startInn2(){mut(function(){var a=S.inn[0],n=newInn(a.bowl);n.target=a.runs+1;S.inn.push(n);S.cur=1;S.brk=false;ui.tab='score'})}
function undo(){if(!hist.length)return;var ox=S.ovx;S=JSON.parse(hist.pop());if(ox)S.ovx=ox;else delete S.ovx;save();render()}

function summary(){
  var L=['🏏 '+S.teams[0].name+' vs '+S.teams[1].name+' ('+S.cfg.overs+' over)'];
  S.inn.forEach(function(I){
    L.push('');L.push(S.teams[I.bat].name+': '+I.runs+'/'+I.wkts+' ('+ov(I.balls)+' over)');
    I.order.forEach(function(i){var b=I.bt[i];L.push('  '+pl(I.bat,i)+' '+b.r+'('+b.b+')'+(b.out?'':'*'))});
    var ex=I.ex.wd+I.ex.nb+I.ex.b+I.ex.lb;L.push('  Extras: '+ex);
    var outs=I.order.filter(function(i){return I.bt[i].out}).map(function(i){return pl(I.bat,i)});
    if(outs.length)L.push('  Out: '+outs.join(', '));
    var bl=Object.keys(I.bw).map(function(i){var b=I.bw[i];return pl(I.bowl,i)+' '+ov(b.b)+'-'+b.m+'-'+b.r+'-'+b.w});
    if(bl.length)L.push('  Bowling: '+bl.join(', '));
  });
  if(S.over)L.push('','🏆 '+S.result);
  return L.join('\n');
}

/* ---------- views ---------- */
function ovPanel(){
  var x=ui.ovp;if(!x||Date.now()>x.until)return '';
  var I=cur(),bt=S.teams[I.bat],bwl=S.teams[I.bowl];
  if(x.k==='card'){
    var rows='<div class="ln hd"><span>Batting</span><span>R (B) 4s 6s</span></div>';
    I.order.forEach(function(i){var b=I.bt[i],isn=(i===I.st||i===I.ns);
      rows+='<div class="ln'+(b.out||isn?'':' no')+'"><span>'+esc(pl(I.bat,i))+(i===I.st?' *':'')+'<small>'+(b.out?esc(dis(I,b.out)):'not out')+'</small></span><b>'+b.r+' ('+b.b+') · '+b.f+'/'+b.s+'</b></div>'});
    rows+='<div class="ln hd"><span>Bowling</span><span>O-M-R-W</span></div>';
    Object.keys(I.bw).forEach(function(i){var w=I.bw[i];rows+='<div class="ln"><span>'+esc(pl(I.bowl,+i))+'</span><b>'+ov(w.b)+'-'+w.m+'-'+w.r+'-'+w.w+'</b></div>'});
    var ex=I.ex.wd+I.ex.nb+I.ex.b+I.ex.lb;
    return '<div class="ovp"><h4><span>'+esc(bt.name)+' scoreboard</span><span>'+I.runs+'/'+I.wkts+' · '+ov(I.balls)+' ov · Extras '+ex+'</span></h4>'+rows+'</div>';
  }
  if(x.k==='recap'){
    var fs=I.feed.filter(function(f){return f.k!=='info'||/^OUT/.test(f.x)}).slice(0,8).map(function(f){return '<div class="fx k-'+f.k+'">'+esc(f.x)+'</div>'}).join('');
    return '<div class="ovp"><h4><span>Pichli gendein</span><span>'+esc(bt.name)+' '+I.runs+'/'+I.wkts+'</span></h4>'+(fs||'<div class="fx">Abhi koi gend nahi</div>')+'</div>';
  }
  return '';
}
function viewOverlay(){
  var I=cur(),bt=S.teams[I.bat];
  var one=function(i,star){if(i==null)return '';var x=I.bt[i];return '<span class="ob'+(star?' st':'')+'">'+esc(pl(I.bat,i))+(star?' *':'')+' <b>'+x.r+'</b> <i>('+x.b+')</i></span>'};
  var bw=I.bowler!=null?I.bw[I.bowler]:null;
  var balls=I.ob.map(function(b){return '<span class="obl k-'+b.k+'">'+esc(b.l)+'</span>'}).join('');
  var info='';
  if(S.over)info='<b>'+esc(S.result)+'</b>';
  else if(I.target!=null){var need=I.target-I.runs,left=S.cfg.overs*6-I.balls;info='Target <b>&nbsp;'+I.target+'&nbsp;</b> · '+(need>0?'<b>&nbsp;'+need+'&nbsp;</b> run / <b>&nbsp;'+left+'&nbsp;</b> gend':'poora')}
  else info='Run rate <b>&nbsp;'+(I.balls?(I.runs*6/I.balls).toFixed(2):'0.00')+'</b>';
  var fh=I.fh&&!I.done?'<span class="ofh">FREE HIT</span>':'';
  var f=ui.ovf,mid;
  if(f&&Date.now()<f.until){
    var T={four:['CHAUKKA! 4','4 run'],six:['CHAKKA! 6','6 run'],w:['OUT!',f.txt||'']}[f.k];
    mid='<div class="ov-fl fl-'+f.k+'"><b>'+T[0]+'</b><span>'+esc(f.k==='w'?T[1]:(f.txt||T[1]))+'</span></div>';
  }else{
    mid='<div class="ov-m"><div class="ov-row">'+one(I.st,1)+one(I.ns,0)+'</div><div class="ov-row dim">'+(bw?'<span>'+esc(pl(I.bowl,I.bowler))+' <b>'+ov(bw.b)+'-'+bw.m+'-'+bw.r+'-'+bw.w+'</b></span>':'')+'<span class="obls">'+balls+'</span>'+fh+'</div></div>';
  }
  return '<div class="ovwrap">'+ovPanel()+'<div class="ovbar"><div class="ov-l"><span class="ov-t">'+esc(bt.name)+'</span><span class="ov-s"><b>'+I.runs+'</b>/'+I.wkts+'</span><span class="ov-o">'+ov(I.balls)+' / '+S.cfg.overs+' ov</span></div>'+mid+'<div class="ov-r">'+info+'</div></div></div>';
}
function viewWait(){
  return '<header><h1>Gao Cricket Live</h1></header><div class="card"><h2>'+(ui.vErr?'Live score nahi mil raha':'Match abhi shuru nahi hua')+'</h2><p class="muted">'+(ui.vErr?'Internet check karo aur link dobara kholo.':'Jaise hi scorer match shuru karega, score yahan apne aap aa jayega. Page refresh karne ki zaroorat nahi.')+'</p></div>';
}
function viewSetup(){
  var ovc=[3,4,5,6,8,10,12,15,20].map(function(n){return '<button class="chip'+(setup.overs===n?' on':'')+'" data-a="ovs" data-v="'+n+'">'+n+'</button>'}).join('');
  var team=function(i){var c=setup.t[i].split('\n').filter(function(s){return s.trim()}).length;
    return '<div class="card"><div class="field"><label for="n'+i+'">Team '+(i?'B':'A')+' ka naam</label><input type="text" id="n'+i+'" value="'+esc(setup.n[i])+'" maxlength="24"></div>'+
    '<div class="field"><label for="t'+i+'">Playing 11 (har line main ek naam)</label><textarea id="t'+i+'" placeholder="Ali&#10;Usman&#10;Hamza&#10;...">'+esc(setup.t[i])+'</textarea></div>'+
    '<div class="cnt'+(c<2?' bad':'')+'" id="c'+i+'">'+c+' khilari</div></div>'};
  var opt=function(vals,sel,fmt){return vals.map(function(v){return '<option value="'+v+'"'+(v===sel?' selected':'')+'>'+fmt(v)+'</option>'}).join('')};

function batRow(I,i,star){

   '<div class="b-meta"><span class="pill">OUT: '+I.wkts+' / '+(N-1)+'</span><span class="pill">Run rate '+rr+'</span><span class="pill">Extras '+ex+'</span><span class="pill">Partnership '+ps+'</span></div><div class="prog"><i style="width:'+Math.min(100,I.balls*100/(S.cfg.overs*6)).toFixed(1)+'%"></i></div>'+chase+'</section>';

    '<div class="row between"><div class="nm nmw" style="font-size:18px">'+av(pl(I.bowl,I.bowler))+'<span>'+esc(pl(I.bowl,I.bowler))+'<small>'+esc(S.teams[I.bowl].name)+'</small></span></div><div class="num" style="text-align:right"><b style="font-family:var(--f-disp);font-size:26px">'+ov(bw.b)+'-'+bw.m+'-'+bw.r+'-'+bw.w+'</b><div class="muted" style="font-size:12px">O-M-R-W</div></div></div>'+

function cardInn(I){

  I.order.forEach(function(i){var b=I.bt[i];var live=(I.st===i||I.ns===i)&&!I.done;
    h+='<div class="tr bat-grid"><span class="nm">'+esc(pl(I.bat,i))+(I.st===i&&!I.done?' *':'')+'<small>'+(b.out?esc(dis(I,b.out)):(live?'batting':'not out'))+'</small></span><span><b>'+b.r+'</b></span><span>'+b.b+'</span><span>'+b.f+'</span><span>'+b.s+'</span><span>'+sr(b.r,b.b)+'</span></div>'});
  h+='</div><p class="num" style="font-size:14px"><b>Extras: '+ex+'</b> (wide '+I.ex.wd+', no ball '+I.ex.nb+', bye '+I.ex.b+', leg bye '+I.ex.lb+')</p>';

  if(I.fow.length)h+='<p style="font-size:14px"><span class="muted">Wicket giray: </span>'+I.fow.map(function(f){return f.w+'-'+f.s+' ('+esc(pl(I.bat,f.p))+', '+f.o+')'}).join(' · ')+'</p>';

  var ks=Object.keys(I.bw);

  return h;
}

function wrapSheet(title,body,closable){

}
function undoLink(){return hist.length?'<button class="btn sm" data-a="undo">↶ Galti ho gayi — pichla ball undo karo</button>':''}
function sheetKind(){
  if(!S)return null;
  var I=cur();
  if(S.brk)return 'brk';
  if(!S.over&&I.pend[0]==='openers')return 'open';
  if(!S.over&&I.pend[0]==='bat')return 'bat';
  if(!S.over&&I.pend[0]==='bowler')return 'bowl';
  return ui.sheet;
}
function bowlList(I,forced){
  return '<div class="pl">'+S.teams[I.bowl].players.map(function(n,i){
    var b=I.bw[i],lim=S.cfg.maxb&&b&&b.b>=S.cfg.maxb*6,blk=forced&&I.last===i&&S.teams[I.bowl].players.length>2;
    var sel=!forced&&I.bowler===i;
    return '<button class="pbtn'+(sel?' on':'')+'" data-a="pw" data-i="'+i+'" data-f="'+(forced?1:0)+'"'+((lim||blk)?' disabled':'')+'>'+av(n)+'<span>'+esc(n)+'<small>'+(b?ov(b.b)+' over · '+b.r+' run · '+b.w+' wkt':'abhi bowling nahi ki')+(lim?' · limit poori':'')+(blk?' · pichla over kiya':'')+'</small></span></button>'}).join('')+'</div>';
}
function openList(I,f,title){
  var arr=f==='bw'?S.teams[I.bowl].players:S.teams[I.bat].players;
  return '<h3>'+title+'</h3><div class="pl">'+arr.map(function(n,i){
    var taken=(f==='st'&&ui.op.ns===i)||(f==='ns'&&ui.op.st===i);

  }

    var ok=ui.op.st!=null&&ui.op.ns!=null&&ui.op.bw!=null;
    return wrapSheet('Innings '+(S.cur+1)+' — kaun khelega?',
      '<p class="muted">'+esc(S.teams[I.bat].name)+' batting, '+esc(S.teams[I.bowl].name)+' bowling</p>'+
      openList(I,'st','Strike pe batsman')+openList(I,'ns','Non-strike batsman')+openList(I,'bw','Pehla bowler')+
      '<button class="btn pri" data-a="opok"'+(ok?'':' disabled')+' style="min-height:56px">Shuru karo</button>'+(S.cur===1?undoLink():''),false);
  }
  if(k==='bat'){
    var lastF=I.fow[I.fow.length-1],yet=S.teams[I.bat].players.map(function(n,i){return i}).filter(function(i){return !I.bt[i]});
    var info=lastF?'<div class="result" style="background:var(--wicket-soft);color:var(--wicket)"><b>OUT #'+lastF.w+' — '+esc(pl(I.bat,lastF.p))+'</b><span>'+esc(dis(I,I.bt[lastF.p].out))+' · '+I.bt[lastF.p].r+' ('+I.bt[lastF.p].b+') · score '+lastF.s+'/'+lastF.w+'</span></div>':'';
    return wrapSheet('Naya batsman kaun aaya?',info+'<div class="pl">'+yet.map(function(i){return '<button class="pbtn" data-a="pb" data-i="'+i+'">'+av(pl(I.bat,i))+'<span>'+esc(pl(I.bat,i))+'<small>batting #'+(I.order.length+1)+'</small></span></button>'}).join('')+'</div>'+undoLink(),false);
  }
  if(k==='bowl'){
    return wrapSheet('Over '+(I.balls/6)+' khatam — agla bowler kaun?','<p class="muted">Score '+I.runs+'/'+I.wkts+'</p>'+bowlList(I,true)+undoLink(),false);
  }
  if(k==='bowler')return wrapSheet('Bowler badlo',bowlList(I,false),true);
  if(k==='ex'){
    var K=ui.ex.k,opts=K==='wd'?[0,1,2,3,4]:K==='nb'?[0,1,2,3,4,5,6]:[1,2,3,4];
    var tt=K==='wd'?'Wide':K==='nb'?'No Ball':K==='b'?'Bye':'Leg Bye';
    var sub=K==='wd'?'Wide ka '+S.cfg.wide+' run alag se judega. Upar se kitne run bhaage?':K==='nb'?'No Ball ka '+S.cfg.nb+' run alag se judega'+(S.cfg.fh?' aur agli gend Free Hit hogi':'')+'. Kitne run bhaage?':'Kitne run bhaage?';
    return wrapSheet(tt,'<p class="muted">'+sub+'</p>'+(K==='nb'?'<button class="chip'+(ui.ex.bye?' on':'')+'" data-a="exbye">'+(ui.ex.bye?'✓ ':'')+'Ye run bye / leg bye hain (bat se nahi)</button>':'')+
      '<div class="chips">'+opts.map(function(r){return '<button class="chip" style="min-width:64px;min-height:56px;font-size:20px" data-a="exr" data-r="'+r+'">'+r+'</button>'}).join('')+'</div>',true);
  }
  if(k==='wk'){
    var w=ui.w,restr=I.fh||w.ball==='nb',kinds=Object.keys(KINDS);
    var allowed=function(x){if(x==='runout')return true;if(restr)return false;if(w.ball==='wd')return x==='stumped'||x==='hitwkt';return true};
    var needF=['caught','stumped','runout'].indexOf(w.k)>=0;
    var fl=needF?'<div class="field"><label for="wfl">'+(w.k==='caught'?'Catch kisne pakda?':w.k==='stumped'?'Wicketkeeper kaun?':'Run out kisne kiya?')+'</label><select id="wfl"><option value="">— chuno (optional) —</option>'+S.teams[I.bowl].players.map(function(n,i){return '<option value="'+i+'"'+(w.fl===i?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select></div>':'';
    return wrapSheet('OUT — wicket #'+(I.wkts+1),
      (I.fh?'<div class="fh"><b>FREE HIT</b><span>Sirf Run Out ho sakta hai</span></div>':'')+
      '<h3>Kaise out hua?</h3><div class="chips">'+kinds.map(function(x){return '<button class="chip'+(w.k===x?' on':'')+'" data-a="wset" data-f="k" data-v="'+x+'"'+(allowed(x)?'':' disabled')+'>'+KINDS[x]+'</button>'}).join('')+'</div>'+
      (w.k==='runout'?'<h3>Kaun out hua?</h3><div class="two"><button class="chip'+(w.who==='st'?' on':'')+'" data-a="wset" data-f="who" data-v="st">'+esc(bn(I.st))+' (strike)</button><button class="chip'+(w.who==='ns'?' on':'')+'" data-a="wset" data-f="who" data-v="ns">'+esc(bn(I.ns))+'</button></div>':'<p>Out: <b>'+esc(bn(I.st))+'</b></p>')+
      fl+
      '<h3>Gend kaisi thi?</h3><div class="chips">'+[['n','Normal'],['wd','Wide'],['nb','No Ball']].map(function(x){return '<button class="chip'+(w.ball===x[0]?' on':'')+'" data-a="wset" data-f="ball" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'+
      (w.k==='runout'?'<h3>Out hone se pehle kitne run bhaage?</h3><div class="chips">'+[0,1,2,3].map(function(r){return '<button class="chip'+(w.r===r?' on':'')+'" data-a="wset" data-f="r" data-v="'+r+'">'+r+'</button>'}).join('')+'</div>':'')+
      '<button class="btn red" data-a="wconf" style="min-height:56px;font-size:18px">OUT confirm karo</button>',true);
  }
  if(k==='ren'&&ui.ren){
    return wrapSheet('Naam badlo','<div class="field"><label for="renin">Khilari ka naam</label><input type="text" id="renin" maxlength="24" value="'+esc(pl(ui.ren.t,ui.ren.i))+'"></div><button class="btn pri" data-a="rensave">Save karo</button>',true);
  }
  return '';
}

function render(){
  var app=$('app');
  if(ui.overlay){document.body.classList.add('ov');if(ui.strip)document.body.classList.add('strip');app.innerHTML=(S&&!ui.boot)?viewOverlay():'';$('nav').innerHTML='';$('sheet').innerHTML='';if(S)checkFlash();return}
  if(ui.boot){app.innerHTML='<p class="muted">Load ho raha hai…</p>';$('nav').innerHTML='';$('sheet').innerHTML='';return}
  if(!S&&ui.viewer){app.innerHTML=viewWait();$('nav').innerHTML='';$('sheet').innerHTML='';return}
  if(!S){app.innerHTML=viewSetup();$('nav').innerHTML='';$('sheet').innerHTML='';return}
  app.innerHTML=ui.tab==='score'?viewScore():ui.tab==='card'?viewCard():ui.tab==='teams'?viewTeams():viewMenu();
  $('nav').innerHTML=navHtml();
  $('sheet').innerHTML=sheetHtml();
  watchBoard();
  checkFlash();
}
var io=null;
function watchBoard(){
  var m=$('mini'),b=document.querySelector('.board');
  if(io){io.disconnect();io=null}
  m.classList.remove('on');
  if(!b||!S||!window.IntersectionObserver)return;
  var I=cur();
  m.innerHTML='<div class="in"><span>'+esc(S.teams[I.bat].name)+'</span><b>'+I.runs+'/'+I.wkts+' · '+ov(I.balls)+'</b><span>Out '+I.wkts+'</span></div>';
  io=new IntersectionObserver(function(en){m.classList.toggle('on',!en[0].isIntersecting)});
  io.observe(b);
}

var fprev={cur:-1,n:0,over:false,init:false};
function flash(k,txt,ms){
  if(ui.overlay){
    if(k==='win')return;
    var d=ms||({six:10000,four:6000,w:8000}[k]||6000);
    ui.ovf={k:k,txt:txt||'',until:Date.now()+d};
    clearTimeout(flash.t);flash.t=setTimeout(function(){ui.ovf=null;if(S)render()},d+60);
    return;
  }
  var el=$('flash');if(!el)return;
  var T={four:['CHAUKKA!','4 run'],six:['CHAKKA!','6 run'],w:['OUT!',txt||''],win:['MATCH KHATAM',txt||'']}[k];
  el.innerHTML='<div class="fl fl-'+k+'"><b>'+T[0]+'</b><span>'+esc(T[1])+'</span></div>';
  clearTimeout(flash.t);flash.t=setTimeout(function(){el.innerHTML=''},ms||(k==='six'?2500:1100));
}
function ovShow(k){
  var ms={card:20000,recap:15000}[k];
  ui.ovp={k:k,until:Date.now()+ms};
  clearTimeout(ovShow.t);ovShow.t=setTimeout(function(){ui.ovp=null;if(S)render()},ms+60);
}
function bname(x){var m=String(x).match(/→ (.+?):/);return m?m[1]:''}
function lastBig(){
  var I=cur(),f=I.feed.filter(function(x){return x.k==='four'||x.k==='six'||x.k==='w'})[0];
  if(!f)return null;
  return {k:f.k,txt:f.k==='w'?f.x.replace(/^OUT #\d+ — /,'').split(' — ')[0]:bname(f.x)};
}
function checkFlash(){
  if(!S){fprev={cur:-1,n:0,over:false,init:false};return}
  var I=cur(),n=I.n||0,fire=null;
  if(fprev.init&&!ui.replay){
    if(S.over&&!fprev.over)fire=['win',S.result,3200];
    else if(fprev.cur===S.cur&&n>fprev.n){
      var f=I.feed[0];
      if(f&&(f.k==='four'||f.k==='six'))fire=[f.k,bname(f.x)];
      else if(f&&f.k==='w')fire=['w',f.x.replace(/^OUT #\d+ — /,'').split(' — ')[0]];
    }
  }
  fprev={cur:S.cur,n:n,over:S.over,init:true};
  var x=S.ovx,redo=false;
  if(ui.overlay&&x&&x.id!==ui.ovid){
    ui.ovid=x.id;
    if(!ui.replay){
      redo=true;
      if(x.k==='off'){ui.ovp=null;ui.ovf=null}
      else if(x.k==='replay'){var lb=lastBig();if(lb)fire=[lb.k,lb.txt]}
      else ovShow(x.k);
    }
  }
  if(fire)flash(fire[0],fire[1],fire[2]);
  if((fire||redo)&&ui.overlay)render()
}
function toast(m){var t=$('toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(function(){t.innerHTML=''},2200)}

function fixW(){
  var I=cur(),w=ui.w,restr=I.fh||w.ball==='nb';
  if(restr&&w.k!=='runout')w.k='runout';
  if(w.ball==='wd'&&w.k!=='runout'&&w.k!=='stumped'&&w.k!=='hitwkt')w.k='stumped';
  if(w.k!=='runout'){w.who='st';w.r=0}
  if(['caught','stumped','runout'].indexOf(w.k)<0)w.fl=null;
}

function act(a,d){
  switch(a){
    case 'ovs':setup.overs=+d.v;save();render();break;
    case 'first':setup.first=+d.v;save();render();break;
    case 'start':startMatch();break;
    case 'example':setup.n=['Gao XI','Mohalla XI'];setup.t=['Ali\nUsman\nHamza\nZaid\nBilal\nSohail\nAdnan\nKashif\nWaqas\nRizwan\nImran','Farhan\nShahid\nTariq\nNaveed\nAsad\nKamran\nJunaid\nNoman\nIrfan\nHaris\nSalman'];save();render();break;
    case 'tab':ui.tab=d.t;ui.sheet=null;ui.confirm=null;window.scrollTo(0,0);render();break;
    case 'run':ball({t:'run',r:+d.r});break;
    case 'ex':ui.ex={k:d.k,bye:false};ui.sheet='ex';render();break;
    case 'exbye':ui.ex.bye=!ui.ex.bye;render();break;
    case 'exr':{var k=ui.ex.k,bye=ui.ex.bye;ui.sheet=null;ball({t:k,r:+d.r,bye:bye});break}
    case 'wk':{var I=cur();ui.w={k:I.fh?'runout':'bowled',who:'st',fl:null,ball:'n',r:0};ui.sheet='wk';render();break}
    case 'wset':ui.w[d.f]=d.f==='r'?+d.v:d.v;fixW();render();break;
    case 'wconf':{var w=ui.w;ui.sheet=null;ball({t:'w',k:w.k,who:w.who,fl:w.fl,ball:w.ball,r:w.r});break}
    case 'undo':ui.sheet=null;undo();break;
    case 'swap':{var I2=cur();if(I2.st==null||I2.ns==null)break;mut(function(){var J=cur(),t=J.st;J.st=J.ns;J.ns=t;feed(J,'info','Strike badli: ab '+bn(J.st)+' strike pe hai')});break}
    case 'close':ui.sheet=null;render();break;
    case 'pb':pickBat(+d.i);break;
    case 'pw':{var forced=d.f==='1';ui.sheet=null;pickBowl(+d.i,forced);break}
    case 'sheet':ui.sheet=d.s;render();break;
    case 'opset':ui.op[d.f]=+d.i;render();break;
    case 'opok':confirmOpen();break;
    case 'inn2':startInn2();break;
    case 'scv':ui.sv=+d.v;render();break;
    case 'ren':ui.ren={t:+d.t,i:+d.i};ui.sheet='ren';render();break;
    case 'rensave':{var v=$('renin').value.trim();if(v){var r=ui.ren;ui.sheet=null;mut(function(){S.teams[r.t].players[r.i]=v})}break}
    case 'copy':{ui.sum=summary();render();var tx=ui.sum;try{navigator.clipboard.writeText(tx).then(function(){toast('Copy ho gaya — WhatsApp main paste karo')},function(){toast('Neeche likhe score ko select karke copy karo')})}catch(e){toast('Neeche likhe score ko select karke copy karo')}break}
    case 'copylink':{var u=baseUrl()+'#live='+live.code;try{navigator.clipboard.writeText(u).then(function(){toast('Link copy ho gaya')},function(){toast('Link ko select karke copy karo')})}catch(e){toast('Link ko select karke copy karo')}break}
    case 'copyov':{var u2=baseUrl()+'#overlay='+live.code;try{navigator.clipboard.writeText(u2).then(function(){toast('Overlay link copy ho gaya')},function(){toast('Link ko select karke copy karo')})}catch(e){toast('Link ko select karke copy karo')}break}
    case 'copystrip':{var u3=baseUrl()+'#strip='+live.code;try{navigator.clipboard.writeText(u3).then(function(){toast('Strip link copy ho gaya')},function(){toast('Link ko select karke copy karo')})}catch(e){toast('Link ko select karke copy karo')}break}
    case 'copyscorer':{var u4=baseUrl()+'#scorer='+live.code;try{navigator.clipboard.writeText(u4).then(function(){toast('Scorer link copy ho gaya')},function(){toast('Link ko select karke copy karo')})}catch(e){toast('Link ko select karke copy karo')}break}
    case 'tv':{if(!S||ui.viewer)break;S.ovx={k:d.k,id:Date.now()};save();pushLive(true);toast(d.k==='off'?'TV se hata diya':'TV pe bhej diya');break}
    case 'endask':ui.confirm='end';render();break;
    case 'endyes':ui.confirm=null;ui.tab='score';mut(function(){var J=cur();J.done=true;J.pend=[];J.why='Innings manual khatam';endInnings()});break;
    case 'newask':ui.confirm='new';render();break;
    case 'cfx':ui.confirm=null;render();break;
    case 'newyes':S=null;hist=[];ui.confirm=null;ui.sum='';ui.tab='score';ui.sheet=null;try{localStorage.removeItem(KEY)}catch(e){}save();pushLive(true);render();break;
  }
}

document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el.dataset)});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(S)return;
  if(id==='t0'||id==='t1'){var i=+id[1];setup.t[i]=e.target.value;var c=e.target.value.split('\n').filter(function(s){return s.trim()}).length;var el=$('c'+i);el.textContent=c+' khilari';el.className='cnt'+(c<2?' bad':'');save()}
  else if(id==='n0'||id==='n1'){var j=+id[1];setup.n[j]=e.target.value;$('fb'+j).textContent=e.target.value||('Team '+(j?'B':'A'));save()}
  else if(id==='ov'){var n=parseInt(e.target.value,10);if(n>=1&&n<=50){setup.overs=n;save()}}
});
document.addEventListener('change',function(e){
  var id=e.target.id,v=e.target.value;
  if(id==='s-wide')setup.wide=+v;else if(id==='s-nb')setup.nb=+v;else if(id==='s-maxb')setup.maxb=+v;else if(id==='s-fh')setup.fh=v==='1';
  else if(id==='wfl'){ui.w.fl=v===''?null:+v}
  save();
});

load();
if(location.hash==='#naya'){S=null;hist=[];try{localStorage.removeItem(KEY)}catch(e){}}
var sm=location.hash.match(/^#scorer=([a-z0-9]+)/i);
if(sm){try{localStorage.setItem('gao-code',sm[1].toLowerCase())}catch(e){}}
live.code=getCode();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
var wm=location.hash.match(/^#(live|overlay|strip)=([a-z0-9]+)/i);
if(wm){var m1=wm[1].toLowerCase();if(m1==='overlay'||m1==='strip'){ui.overlay=true;if(m1==='strip')ui.strip=true}startViewer(wm[2])}else{render();if(S)pushLive(true)}
})();
</script>
</body></html>
